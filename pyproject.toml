[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ufcalendar"
version = "0.8.2"
description = "MMA Fight Data API client for Python — UFC, PFL, OKTAGON, BKFC, RIZIN events, fight stats, results, rankings history, judges' scorecards and consensus odds."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "UFCalendar", email = "api@ufcalendar.com" }]
keywords = ["mma", "ufc", "ufc-stats", "mma-api", "ufc-api", "fight-data", "sports-data", "mma-fight-data-api", "mma-stats", "ufc-rankings", "ufc-scorecards", "pfl", "oktagon", "bkfc", "rizin", "rankings", "api", "mcp", "mcp-server", "mma-mcp", "fight-api", "mma-odds", "consensus-odds"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://www.ufcalendar.com/developers"
"Free trial" = "https://www.ufcalendar.com/account/api?trial=1"
Documentation = "https://api.ufcalendar.com/docs"
"UFC data coverage" = "https://www.ufcalendar.com/developers/ufc-api"
"OpenAPI spec" = "https://api.ufcalendar.com/openapi.json"
Source = "https://github.com/UFCalendar/ufcalendar-python"
Issues = "https://github.com/UFCalendar/ufcalendar-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["ufcalendar"]

[tool.hatch.build.targets.sdist]
include = ["ufcalendar", "README.md", "LICENSE", "pyproject.toml", "tests", "examples"]
